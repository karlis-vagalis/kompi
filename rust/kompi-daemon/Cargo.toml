[package]
name = "kompi-daemon"
repository = "https://github.com/karlis-vagalis/kompi"
version = "0.1.3"
edition.workspace = true
license.workspace = true

[[bin]]
name = "kompi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
ciborium.workspace = true
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hex = "0.4"
kompi-protocol.workspace = true
iroh = "1.4.1"
iroh-tickets = "1.0"
jiff.workspace = true
libc = "0.2"
mime = "0.3"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
rand = "0.9"
sha2 = "0.11"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sqlx.workspace = true
tokio = { version = "1", features = ["full"] }
uuid = { workspace = true, features = ["v4"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hmac = "0.13.0"
url = "2.5.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
web-push = { package = "sad-web-push", version = "0.12.0", default-features = false }
zeroize = { version = "1.9.1", features = ["zeroize_derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading"] }
