name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.10
      - run: rustup update stable && rustup default stable
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - run: just extension-typecheck
      - working-directory: pi-extension
        run: bun run test
      - run: just sdk-build
      - working-directory: daemon
        run: bun test
      - run: just rust-test
      - if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          rm -rf target/debug
          just daemon-build
          mkdir -p kompi-linux-x86_64/worker
          cp target/release/kompi LICENSE kompi-linux-x86_64/
          mkdir -p rust-dependency-sources/.cargo
          cargo vendor --locked --versioned-dirs rust-dependency-sources/vendor > rust-dependency-sources/.cargo/config.toml
          # Preserve crate/version paths, including notices below a crate's root.
          (cd rust-dependency-sources/vendor && find . -type f \( -iname 'license*' -o -iname 'licence*' -o -iname 'copying*' -o -iname 'notice*' -o -iname 'copyright*' \) -print0) > notices.list
          mkdir -p kompi-linux-x86_64/notices
          tar -C rust-dependency-sources/vendor --null -T notices.list -cf - | tar -C kompi-linux-x86_64/notices -xf -
          cp -r third-party rust-dependency-sources/
          mkdir -p kompi-linux-x86_64/notices/iroh-tickets
          cp third-party/iroh-tickets/LICENSE-* kompi-linux-x86_64/notices/iroh-tickets/
          tar czf rust-dependency-sources.tar.gz rust-dependency-sources
          cp -r daemon/{package.json,bun.lock,dist-worker} kompi-linux-x86_64/worker/
          test -s kompi-linux-x86_64/worker/dist-worker/daemon/src/worker.js
          (
            cd kompi-linux-x86_64/worker
            bun install --production --frozen-lockfile
            timeout 30 bun run worker </dev/null
            rm -rf node_modules
          )
          tar czf kompi-linux-x86_64.tar.gz kompi-linux-x86_64
      - if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon
          path: |
            kompi-linux-x86_64.tar.gz
            rust-dependency-sources.tar.gz
          if-no-files-found: error
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '27'
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: '1.59.0'
      - name: Install pinned Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;30.0.16248370' 'cmake;4.1.2'
      - working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Install native build tools
        run: |
          python3 -m venv "$RUNNER_TEMP/native-tools"
          "$RUNNER_TEMP/native-tools/bin/pip" install 'uv==0.11.26'
          echo "$RUNNER_TEMP/native-tools/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmake/4.1.2/bin" >> "$GITHUB_PATH"
      - run: android/app/src/main/cpp/whistle/fetch-native.sh
      - run: just apk-release
      - if: inputs.package || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
