name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  authorize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require owner-created immutable version tag on main history
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_ACTOR" == "$OWNER" ]]
          [[ "$GITHUB_TRIGGERING_ACTOR" == "$OWNER" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse "$GITHUB_REF^{commit}")" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor HEAD origin/main
  build:
    needs: authorize
    uses: ./.github/workflows/ci.yml
    with:
      package: true
  sign:
    needs: build
    environment: android-signing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-apk
      - name: Sign and verify certificate
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CERT: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          [[ "$CERT" =~ ^[0-9a-f]{64}$ ]]
          umask 077
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$key"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          version=$("${signer%/*}/aapt" dump badging app-release-unsigned.apk | awk -F "'" '/^package: / {print $6}')
          [[ "v$version" == "$GITHUB_REF_NAME" ]]
          "$signer" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out kompi.apk app-release-unsigned.apk
          "$signer" verify --verbose --print-certs kompi.apk > cert.txt
          grep -Fx "Signer #1 certificate SHA-256 digest: $CERT" cert.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-apk
          path: kompi.apk
          if-no-files-found: error
  publish:
    needs: sign
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-apk
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: daemon-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: dependency-sources
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          hosts=(kompi-daemon-x86_64-unknown-linux-gnu.tar.gz kompi-daemon-x86_64-pc-windows-msvc.zip)
          for host in "${hosts[@]}"; do
            [[ "$(sha256sum "$host" | cut -d' ' -f1)" == "$(awk 'NR==1 {print $1}' "$host.sha256")" ]]
          done
          assets=(kompi.apk kompi-daemon-installer.sh kompi-daemon-installer.ps1 "${hosts[@]}" rust-dependency-sources.tar.gz)
          sha256sum "${assets[@]}" > SHA256SUMS
          assets+=(SHA256SUMS)
          releases="repos/$GH_REPO/releases"
          tag=$GITHUB_REF_NAME
          check_tag() {
            local obj sha
            obj=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq .object)
            if [[ $(jq -r .type <<< "$obj") == tag ]]; then
              sha=$(jq -r .sha <<< "$obj")
              obj=$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .object)
            fi
            jq -e --arg sha "$GITHUB_SHA" '.type == "commit" and .sha == $sha' <<< "$obj" >/dev/null
          }
          check_tag
          if [[ "$tag" == v0.1.0 ]]; then
            id=455244515 # Initial pre-existing draft, not a public tag lookup.
          else
            ids=$(gh api --paginate "$releases?per_page=100" | jq -rs --arg t "$tag" '[.[][] | select(.tag_name==$t).id] | unique | if length>1 then error("ambiguous release") else .[0] // empty end')
            id=${ids:-}
            if [[ -z "$id" ]]; then
              id=$(gh api "$releases" -f tag_name="$tag" -f target_commitish="$GITHUB_SHA" -f name="$tag" -F draft=true --jq .id)
            fi
          fi
          release="$releases/$id"
          snapshot() { gh api "$release" | jq -e --arg t "$tag" 'select(.tag_name==$t)'; }
          state=$(snapshot)
          for file in "${assets[@]}"; do
            digest=sha256:$(sha256sum "$file" | cut -d' ' -f1)
            if jq -e --arg f "$file" --arg d "$digest" '.assets[] | select(.name==$f and .digest==$d and .state=="uploaded")' <<< "$state" >/dev/null; then continue; fi
            [[ $(snapshot | jq .draft) == true ]]
            old=$(jq -r --arg f "$file" '.assets[] | select(.name==$f).id' <<< "$state")
            if [[ -n "$old" ]]; then gh api -X DELETE "$releases/assets/$old"; fi
            gh api "https://uploads.github.com/repos/$GH_REPO/releases/$id/assets?name=$file" -H 'Content-Type: application/octet-stream' --input "$file" --silent
          done
          state=$(snapshot)
          [[ $(jq '.assets | length' <<< "$state") == "${#assets[@]}" ]]
          for file in "${assets[@]}"; do
            digest=sha256:$(sha256sum "$file" | cut -d' ' -f1)
            jq -e --arg f "$file" --arg d "$digest" '.assets[] | select(.name==$f and .digest==$d and .state=="uploaded")' <<< "$state" >/dev/null
          done
          check_tag
          if [[ $(jq .draft <<< "$state") == true ]]; then
            gh api -X PATCH "$release" -F draft=false | jq -e '.draft == false'
          fi
